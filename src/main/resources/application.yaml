spring:
  application:
    name: salon-backend
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Instants bind as UTC OffsetDateTime (Hibernate 7 default TIMESTAMP_UTC), whatever the JVM
        # zone. Do not set hibernate.jdbc.time_zone: it also shifts LocalTime (TIME columns) by the
        # JVM offset (ADR-0006).
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
