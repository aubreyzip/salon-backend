spring:
  application:
    name: salon-backend
  data:
    web:
      pageable:
        max-page-size: 100
  modulith:
    events:
      # Outbox (ADR-0011, ADR-0014): publications whose listener failed or was interrupted by a
      # shutdown are resubmitted at startup. Listeners are idempotent.
      republish-outstanding-events-on-restart: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Instants bind as UTC OffsetDateTime (Hibernate 7 default TIMESTAMP_UTC), whatever the JVM
        # zone. Do not set hibernate.jdbc.time_zone: it also shifts LocalTime (TIME columns) by the
        # JVM offset (ADR-0006).
        type:
          preferred_instant_jdbc_type: TIMESTAMP_UTC
